<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hood River Live</title>
<meta name="description" content="Hood River, Oregon, as live pixel art: the real time of day, the real weather, and the occasional surprise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --text: #ebe8e0; --dim: #969ca6; --amber: #ffb24a; --line: #22272e;
    --display: "Silkscreen", "Courier New", monospace;
    --body: "Instrument Sans", system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 var(--body); padding-inline: 16px; padding-block: 24px 40px; min-height: 100vh; }
  main { max-width: 1280px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font: 400 clamp(22px, 4vw, 32px)/1 var(--display); color: var(--amber); margin: 0; letter-spacing: .02em; }
  .sub { color: var(--dim); margin: 0; }
  .panel { position: relative; background: #000; border-radius: 10px; padding: clamp(6px, 1.2vw, 14px); box-shadow: 0 0 0 1px var(--line); }
  .panel canvas { display: block; width: 100%; aspect-ratio: 4 / 1; image-rendering: pixelated; }
  #dots { position: absolute; pointer-events: none; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: 500 13px var(--body); color: var(--text); background: #171b21; border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--amber); color: #ffe2b5; background: #33260f; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .status { color: var(--dim); font-size: 13px; margin-left: auto; }
  footer { color: var(--dim); font-size: 13px; max-width: 70ch; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hood River, Live</h1>
    <p class="sub">The real sky, the real weather, right now.</p>
  </header>
  <div class="panel" id="panel">
    <canvas id="px" width="256" height="64" aria-label="Pixel-art view of Hood River, Oregon, across the Columbia River"></canvas>
    <canvas id="dots"></canvas>
  </div>
  <div class="bar">
    <button id="led" aria-pressed="false">LED look</button>
    <button id="full">Full screen</button>
    <span class="status" id="status">Loading…</span>
  </div>
  <footer>Looking south across the Columbia from the Washington shore: the Hood River Bridge, the town, and Mt. Hood. The sun, moon and weather follow what's really happening in Hood River, Oregon.</footer>
</main>
<script type="module">
  import { start } from "./src/main.js";
  const px = document.getElementById("px"), dots = document.getElementById("dots");
  let led = false;
  try { led = localStorage.getItem("led") === "1"; } catch (e) {}

  function drawDots() { // the LED look: a mask of round dots over the pixels
    const r = px.getBoundingClientRect(), p = document.getElementById("panel").getBoundingClientRect();
    Object.assign(dots.style, { left: `${r.left - p.left}px`, top: `${r.top - p.top}px`, width: `${r.width}px`, height: `${r.height}px` });
    dots.width = Math.round(r.width * devicePixelRatio); dots.height = Math.round(r.height * devicePixelRatio);
    const g = dots.getContext("2d");
    g.clearRect(0, 0, dots.width, dots.height);
    document.getElementById("led").setAttribute("aria-pressed", led);
    if (!led) return;
    const s = dots.width / 256;
    g.fillStyle = "#000"; g.fillRect(0, 0, dots.width, dots.height);
    g.globalCompositeOperation = "destination-out";
    for (let y = 0; y < 64; y++) for (let x = 0; x < 256; x++) { g.beginPath(); g.arc((x + .5) * s, (y + .5) * s, s * .36, 0, 6.2832); g.fill(); }
    g.globalCompositeOperation = "source-over";
  }
  addEventListener("resize", drawDots);
  document.getElementById("led").onclick = () => { led = !led; try { localStorage.setItem("led", led ? "1" : "0"); } catch (e) {} drawDots(); };
  document.getElementById("full").onclick = () => document.getElementById("panel").requestFullscreen?.().catch(() => {});
  document.addEventListener("fullscreenchange", () => setTimeout(drawDots, 50));
  drawDots();
  start(px, { onStatus: s => { document.getElementById("status").textContent = `${s.fps.toFixed(0)} fps · ${s.live ? "live weather" : "weather loading"}`; } })
    .catch(e => { document.getElementById("status").textContent = "Couldn't load the scene."; console.error(e); });
</script>
</body>
</html>
